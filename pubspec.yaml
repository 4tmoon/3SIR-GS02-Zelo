name: zelo
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
    
  shared_preferences: ^2.2.2
  http: ^1.2.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.5
  path: ^1.9.1
  sqflite_common_ffi_web: ^1.2.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo-zelo.jpg"
  web:
    generate: true
    image_path: "assets/images/logo-zelo.jpg"
    background_color: "#ffffff"